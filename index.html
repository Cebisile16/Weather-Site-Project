<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>🌤 Weather App</h1>

    <div class="search-box">
        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name">

        <button id="searchBtn">
            Search
        </button>
    </div>

    <div id="weatherCard" class="weather-card">

        <h2 id="cityName">
            City
        </h2>

        <h3 id="temperature">
            -- °C
        </h3>

        <p id="description">
            Weather description
        </p>

        <p id="humidity">
            Humidity:
        </p>

        <p id="wind">
            Wind:
        </p>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
